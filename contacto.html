<div class="container">
  <h3 class="center">Contacto</h3>
  <p class="center">Dejanos tu mensaje y pronto nos comunicaremos contigo.</p>

  <div class="row">
    <form class="col s12 m8 offset-m2" id="form-contacto">
      <div class="card">
        <div class="card-content">
          <div class="input-field">
            <input id="nombre" name="nombre" type="text">
            <label for="nombre">Nombre</label>
          </div>

          <div class="input-field">
            <input id="correo" name="correo" type="email">
            <label for="correo">Correo</label>
          </div>

          <div class="input-field">
            <textarea id="mensaje" name="mensaje" class="materialize-textarea"></textarea>
            <label for="mensaje">Mensaje</label>
          </div>
        </div>
        <div class="card-action center">
          <button class="btn red darken-3" type="submit">Enviar mensaje</button>
        </div>
      </div>
    </form>
  </div>
</div>
